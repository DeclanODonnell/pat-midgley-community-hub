backend:
  name: git-gateway
  branch: main

publish_mode: simple
site_url: "https://patmidgley.netlify.app"
display_url: "https://patmidgley.netlify.app"
logo_url: "/images/patmidgley-header-logo.png"
locale: "en"

media_folder: "images/whats-on"
public_folder: "/images/whats-on"

custom_css: "/admin/admin.css"

collections:
  - name: "home"
    label: "Home"
    label_singular: "Section"
    files:
      - name: "home"
        label: "Edit the Home page"
        file: "data/home.json"
        format: "json"
        fields:
          - label: "Welcome section"
            name: "hero"
            widget: "object"
            hint: "The main welcome section at the top of the home page."
            fields:
              - label: "Small heading"
                name: "eyebrow"
                widget: "string"
                hint: "Example: The heart of the Wybourn"
              - label: "Main heading"
                name: "title"
                widget: "string"
              - label: "Introduction text"
                name: "lead"
                widget: "text"
              - label: "Photo 1"
                name: "image_1"
                widget: "image"
                required: false
              - label: "Photo 2"
                name: "image_2"
                widget: "image"
                required: false
              - label: "Weekly highlight title"
                name: "note_title"
                widget: "string"
                hint: "Example: Welcome Place Chatty Cafe"
              - label: "Weekly highlight text"
                name: "note_text"
                widget: "string"
          - label: "About section"
            name: "about"
            widget: "object"
            hint: "The 'At the heart of the community' section."
            fields:
              - label: "Small heading"
                name: "eyebrow"
                widget: "string"
              - label: "Main heading"
                name: "title"
                widget: "string"
              - label: "Paragraph 1"
                name: "paragraph_1"
                widget: "text"
              - label: "Paragraph 2"
                name: "paragraph_2"
                widget: "text"
              - label: "Paragraph 3"
                name: "paragraph_3"
                widget: "text"
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false
              - label: "Opening Day box title"
                name: "opening_day_title"
                widget: "string"
              - label: "Opening Day text 1"
                name: "opening_day_text_1"
                widget: "text"
              - label: "Opening Day text 2"
                name: "opening_day_text_2"
                widget: "text"
          - label: "In memory section"
            name: "memorial"
            widget: "object"
            hint: "The memorial section for Councillor Pat Midgley."
            fields:
              - label: "Small heading"
                name: "eyebrow"
                widget: "string"
              - label: "Main heading"
                name: "title"
                widget: "string"
              - label: "Dates"
                name: "dates"
                widget: "string"
                hint: "Example: 27 July 1937 - 29 March 2020"
              - label: "Paragraph 1"
                name: "paragraph_1"
                widget: "text"
              - label: "Paragraph 2"
                name: "paragraph_2"
                widget: "text"
              - label: "Paragraph 3"
                name: "paragraph_3"
                widget: "text"
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false
  - name: "about"
    label: "About"
    label_singular: "Section"
    files:
      - name: "about"
        label: "Edit the About page"
        file: "data/about.json"
        format: "json"
        fields:
          - label: "Welcome section"
            name: "hero"
            widget: "object"
            fields:
              - label: "Small heading"
                name: "eyebrow"
                widget: "string"
              - label: "Main heading"
                name: "title"
                widget: "string"
              - label: "Paragraph 1"
                name: "paragraph_1"
                widget: "text"
              - label: "Paragraph 2"
                name: "paragraph_2"
                widget: "text"
              - label: "Paragraph 3"
                name: "paragraph_3"
                widget: "text"
              - label: "Opening Day box title"
                name: "opening_day_title"
                widget: "string"
              - label: "Opening Day text 1"
                name: "opening_day_text_1"
                widget: "text"
              - label: "Opening Day text 2"
                name: "opening_day_text_2"
                widget: "text"
          - label: "In memory section"
            name: "memorial"
            widget: "object"
            fields:
              - label: "Small heading"
                name: "eyebrow"
                widget: "string"
              - label: "Main heading"
                name: "title"
                widget: "string"
              - label: "Dates"
                name: "dates"
                widget: "string"
                hint: "Example: 27 July 1937 - 29 March 2020"
              - label: "Paragraph 1"
                name: "paragraph_1"
                widget: "text"
              - label: "Paragraph 2"
                name: "paragraph_2"
                widget: "text"
              - label: "Paragraph 3"
                name: "paragraph_3"
                widget: "text"
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false
  - name: "whats_on"
    label: "What's On"
    label_singular: "Event"
    files:
      - name: "events"
        label: "Edit the What's On page"
        file: "data/whats-on.json"
        format: "json"
        fields:
          - label: "One-off events (special dates)"
            name: "one_off_events"
            widget: "list"
            label_singular: "One-off event"
            summary: "{{date}} - {{title}}"
            hint: "Use this area for events that happen once, such as Armed Forces Day. To add one, click 'Add one-off event'. To edit one, click on it. To delete one, use the bin/delete button."
            fields:
              - label: "Date shown on website"
                name: "date"
                widget: "datetime"
                default: ""
                date_format: "YYYY-MM-DD"
                time_format: false
                format: "YYYY-MM-DD"
                hint: "Pick the date of the event."
              - label: "Event name"
                name: "title"
                widget: "string"
                hint: "Example: Armed Forces Day at the Hub"
              - label: "Time"
                name: "time"
                widget: "string"
                hint: "Example: 12pm - 3pm or See Facebook for timings"
              - label: "Short description"
                name: "description"
                widget: "text"
                hint: "Write a short description that will appear on the website."
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false
                hint: "Upload a photo if you want one to appear with this event."
          - label: "Weekly schedule"
            name: "weekly_schedule"
            widget: "list"
            label_singular: "Weekly activity"
            summary: "{{day}} - {{title}} ({{time}})"
            hint: "Use this area for regular weekly activities. To add one, click 'Add weekly activity'. To edit one, click on it. To delete one, use the bin/delete button."
            fields:
              - label: "Day of the week"
                name: "day"
                widget: "select"
                options:
                  - "Monday"
                  - "Tuesday"
                  - "Wednesday"
                  - "Thursday"
                  - "Friday"
                  - "Saturday"
                  - "Sunday"
              - label: "Activity name"
                name: "title"
                widget: "string"
                hint: "Example: Welcome Place Chatty Cafe"
              - label: "Time"
                name: "time"
                widget: "string"
                hint: "Example: 11am - 1pm"
              - label: "Short description"
                name: "description"
                widget: "text"
                hint: "Write a short description that will appear on the website."
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false
                hint: "Upload a photo if you want one to appear with this activity."
  - name: "room_hire"
    label: "Room Hire"
    label_singular: "Section"
    files:
      - name: "room-hire"
        label: "Edit the Room Hire page"
        file: "data/room-hire.json"
        format: "json"
        fields:
          - label: "Welcome section"
            name: "hero"
            widget: "object"
            fields:
              - label: "Small heading"
                name: "eyebrow"
                widget: "string"
              - label: "Main heading"
                name: "title"
                widget: "string"
              - label: "Paragraph 1"
                name: "paragraph_1"
                widget: "text"
              - label: "Paragraph 2"
                name: "paragraph_2"
                widget: "text"
                hint: "Usually the booking email and phone number."
              - label: "Photo 1"
                name: "image_1"
                widget: "image"
                required: false
              - label: "Photo 2"
                name: "image_2"
                widget: "image"
                required: false
          - label: "Pricing tables"
            name: "pricing"
            widget: "list"
            label_singular: "Pricing table"
            summary: "{{title}}"
            hint: "Each table is a box of rates, such as 'Organisation rates'. To add one, click 'Add pricing table'."
            fields:
              - label: "Table title"
                name: "title"
                widget: "string"
                hint: "Example: Organisation rates (meetings, training etc)"
              - label: "Rates"
                name: "rates"
                widget: "list"
                label_singular: "Rate"
                summary: "{{text}}"
                hint: "Add one line per rate, such as 'Full centre - £25 per hour'."
                fields:
                  - label: "Rate text"
                    name: "text"
                    widget: "string"
  - name: "resources"
    label: "Resources"
    label_singular: "Section"
    files:
      - name: "resources"
        label: "Edit the Resources page"
        file: "data/resources.json"
        format: "json"
        fields:
          - label: "Welcome section"
            name: "hero"
            widget: "object"
            fields:
              - label: "Small heading"
                name: "eyebrow"
                widget: "string"
              - label: "Main heading"
                name: "title"
                widget: "string"
              - label: "Paragraph 1"
                name: "paragraph_1"
                widget: "text"
              - label: "Paragraph 2"
                name: "paragraph_2"
                widget: "text"
              - label: "Side box tag"
                name: "card_tag"
                widget: "string"
              - label: "Side box title"
                name: "card_title"
                widget: "string"
              - label: "Side box text"
                name: "card_text"
                widget: "text"
          - label: "Useful contacts"
            name: "cards"
            widget: "list"
            label_singular: "Contact card"
            summary: "{{title}}"
            hint: "Each card is a support service or contact. To add one, click 'Add contact card'."
            fields:
              - label: "Tag"
                name: "tag"
                widget: "string"
                hint: "Example: Work & Skills"
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Description"
                name: "description"
                widget: "text"
              - label: "Extra line"
                name: "mini_text"
                widget: "string"
                required: false
                hint: "Example: Email: wybournworks@greatplaces.org.uk. Leave blank if not needed."
              - label: "Link text"
                name: "link_text"
                widget: "string"
                required: false
                hint: "Example: See weekly times. Leave blank if this card has no link."
              - label: "Link web address"
                name: "link_url"
                widget: "string"
                required: false
                hint: "Example: whats-on.html"
          - label: "Employment support section"
            name: "employment"
            widget: "object"
            fields:
              - label: "Small heading"
                name: "eyebrow"
                widget: "string"
              - label: "Main heading"
                name: "title"
                widget: "string"
              - label: "Paragraph 1"
                name: "paragraph_1"
                widget: "text"
              - label: "Paragraph 2"
                name: "paragraph_2"
                widget: "text"
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false
  - name: "partners"
    label: "Partners"
    label_singular: "Section"
    files:
      - name: "partners"
        label: "Edit the Partners page"
        file: "data/partners.json"
        format: "json"
        fields:
          - label: "Welcome section"
            name: "hero"
            widget: "object"
            fields:
              - label: "Small heading"
                name: "eyebrow"
                widget: "string"
              - label: "Main heading"
                name: "title"
                widget: "string"
              - label: "Paragraph 1"
                name: "paragraph_1"
                widget: "text"
              - label: "Paragraph 2"
                name: "paragraph_2"
                widget: "text"
              - label: "Side box tag"
                name: "card_tag"
                widget: "string"
              - label: "Side box title"
                name: "card_title"
                widget: "string"
              - label: "Side box text"
                name: "card_text"
                widget: "text"
          - label: "Partner organisations"
            name: "partners"
            widget: "list"
            label_singular: "Partner"
            summary: "{{title}}"
            hint: "Each card is a partner organisation. To add one, click 'Add partner'."
            fields:
              - label: "Tag"
                name: "tag"
                widget: "string"
                hint: "Example: Housing & Community"
              - label: "Organisation name"
                name: "title"
                widget: "string"
              - label: "Description"
                name: "description"
                widget: "text"
          - label: "Get in touch box"
            name: "callout"
            widget: "object"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Text"
                name: "text"
                widget: "text"
  - name: "news"
    label: "News & Updates"
    label_singular: "Post"
    files:
      - name: "posts"
        label: "Edit the News & Updates page"
        file: "data/news.json"
        format: "json"
        fields:
          - label: "News posts"
            name: "posts"
            widget: "list"
            label_singular: "News post"
            summary: "{{date_label}} - {{title}}"
            hint: "Use this area for news stories and updates. To add one, click 'Add news post'. To edit one, click on it. To delete one, use the bin/delete button. Newest posts should usually go at the top."
            fields:
              - label: "Date shown on website"
                name: "date_label"
                widget: "string"
                hint: "Type this exactly how you want it to appear. Example: March 2024 or Sunday 4 February 2024"
              - label: "Headline"
                name: "title"
                widget: "string"
                hint: "Example: Summer recap 2024"
              - label: "Main picture"
                name: "image"
                widget: "image"
                required: false
                media_folder: "/images/news"
                public_folder: "/images/news"
                hint: "Upload a photo if you want one to appear with the news story."
              - label: "Story text"
                name: "summary"
                widget: "text"
                hint: "Write the news story here. Use a blank line to start a new paragraph."
  - name: "team"
    label: "Meet the Team"
    label_singular: "Section"
    files:
      - name: "team"
        label: "Edit the Meet the Team page"
        file: "data/team.json"
        format: "json"
        fields:
          - label: "Welcome section"
            name: "hero"
            widget: "object"
            fields:
              - label: "Small heading"
                name: "eyebrow"
                widget: "string"
              - label: "Main heading"
                name: "title"
                widget: "string"
              - label: "Paragraph 1"
                name: "paragraph_1"
                widget: "text"
              - label: "Paragraph 2"
                name: "paragraph_2"
                widget: "text"
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false
          - label: "Hub Team"
            name: "hub_team"
            widget: "list"
            label_singular: "Team member"
            summary: "{{name}}"
            hint: "The people who run the hub day to day. To add one, click 'Add team member'."
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "Role"
                name: "role"
                widget: "string"
                hint: "Example: Centre Manager"
              - label: "Short bio"
                name: "bio"
                widget: "text"
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false
                hint: "If left blank, the person's initials will be shown instead."
          - label: "Trustees"
            name: "trustees"
            widget: "list"
            label_singular: "Trustee"
            summary: "{{name}}"
            hint: "Trustees are shown in the order listed here, alternating photo left/right. To add one, click 'Add trustee'."
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "Role"
                name: "role"
                widget: "string"
                hint: "Example: Chair — Local Resident"
              - label: "Bio"
                name: "bio"
                widget: "text"
                hint: "Use a blank line to start a new paragraph."
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false
  - name: "contact"
    label: "Contact"
    label_singular: "Section"
    files:
      - name: "contact"
        label: "Edit the Contact page"
        file: "data/contact.json"
        format: "json"
        fields:
          - label: "Welcome section"
            name: "hero"
            widget: "object"
            fields:
              - label: "Small heading"
                name: "eyebrow"
                widget: "string"
              - label: "Main heading"
                name: "title"
                widget: "string"
              - label: "Paragraph"
                name: "paragraph"
                widget: "text"
              - label: "Address"
                name: "address"
                widget: "string"
              - label: "Email"
                name: "email"
                widget: "string"
              - label: "Phone"
                name: "phone"
                widget: "string"
          - label: "Introduction"
            name: "intro"
            widget: "object"
            fields:
              - label: "Small heading"
                name: "eyebrow"
                widget: "string"
              - label: "Main heading"
                name: "title"
                widget: "string"
              - label: "Text"
                name: "text"
                widget: "text"
          - label: "Contact routes"
            name: "routes"
            widget: "list"
            label_singular: "Contact route"
            summary: "{{title}}"
            hint: "Each box is a way to get in touch. To add one, click 'Add contact route'."
            fields:
              - label: "Small heading"
                name: "eyebrow"
                widget: "string"
                hint: "Example: General Enquiries"
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Description"
                name: "description"
                widget: "text"
              - label: "Email"
                name: "email"
                widget: "string"
              - label: "Phone"
                name: "phone"
                widget: "string"
                required: false
              - label: "Button text"
                name: "button_text"
                widget: "string"
